name: erp-refatorado

services:
  mariadb:
    image: mariadb:12.3
    restart: on-failure
    environment:
      MARIADB_ROOT_PASSWORD: "root"
      MARIADB_DATABASE: "erp-refatorado"
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 20s
      timeout: 10s
      start_period: 10s
      retries: 5  
      
      
